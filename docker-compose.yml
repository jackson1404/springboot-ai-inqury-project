services:
  postgres:
    image: postgres:16-alpine
    container_name: spring-ai-demo-postgres
    environment:
      POSTGRES_DB: spring_ai_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - spring_ai_demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spring_ai_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: spring-ai-demo-adminer
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  spring_ai_demo_pgdata:
