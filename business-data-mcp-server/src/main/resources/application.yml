spring:
  application:
    name: business-data-mcp-server
  main:
    banner-mode: off
    web-application-type: none

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:spring_ai_demo}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${APP_DB_DDL_AUTO:update}
    show-sql: ${APP_DB_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  ai:
    mcp:
      server:
        name: business-data-mcp-server
        version: 0.0.1
        stdio: true
        type: SYNC
        annotation-scanner:
          enabled: true

app:
  seed:
    enabled: ${APP_DB_SEED_ENABLED:true}


mcp:
  server:
    # MCP stdio protocol uses stdout/stdin, so server logs must go to a file, not console.
    log-file: ${MCP_SERVER_LOG_FILE:target/business-data-mcp-server.log}

logging:
  level:
    com.jack.springaiopenrouter: ${APP_LOG_LEVEL:INFO}
    org.springframework.ai: ${SPRING_AI_LOG_LEVEL:INFO}
