server:
  port: ${MCP_DATA_SERVER_PORT:8082}

spring:
  application:
    name: business-data-mcp-server
  main:
    banner-mode: off

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:spring_ai_demo}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${APP_DB_DDL_AUTO:update}
    show-sql: ${APP_DB_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  ai:
    mcp:
      server:
        enabled: true
        name: business-data-mcp-server
        version: 0.0.1
        protocol: STREAMABLE
        type: SYNC
        annotation-scanner:
          enabled: true
        streamable-http:
          mcp-endpoint: ${MCP_DATA_SERVER_ENDPOINT:/mcp}

app:
  seed:
    enabled: ${APP_DB_SEED_ENABLED:true}

mcp:
  server:
    # In Streamable HTTP mode, stdout is no longer used for the MCP protocol,
    # so console logging is safe. Keep the file log for easier debugging.
    log-file: ${MCP_SERVER_LOG_FILE:target/business-data-mcp-server.log}

logging:
  level:
    com.jack.springaiopenrouter: ${APP_LOG_LEVEL:INFO}
    org.springframework.ai: ${SPRING_AI_LOG_LEVEL:INFO}
